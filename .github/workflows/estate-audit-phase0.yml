name: Estate audit Phase 0 foundations

on:
  pull_request:
    paths:
      - "tools/szl_estate/**"
      - ".github/workflows/estate-audit-phase0.yml"
  push:
    branches: [main]
    paths:
      - "tools/szl_estate/**"
      - ".github/workflows/estate-audit-phase0.yml"

permissions:
  contents: read

concurrency:
  group: estate-audit-phase0-${{ github.ref }}
  cancel-in-progress: true

jobs:
  offline-foundations:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    strategy:
      matrix:
        python: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python }}
      - name: Install small pinned build and test closure
        run: |
          python -m pip install --no-cache-dir --only-binary=:all: -r tools/szl_estate/requirements-dev.txt
      - name: Install the independent package
        run: python -m pip install --no-deps --no-build-isolation tools/szl_estate
      - name: Check dependency consistency
        run: python -m pip check
      - name: Run reviewed offline foundation tests
        run: python -m pytest tools/szl_estate/tests
      - name: Verify unknown remote scope fails closed
        shell: bash
        run: |
          set +e
          python -I -m szl_estate verify --out "$RUNNER_TEMP/phase0"
          result=$?
          set -e
          test "$result" -eq 1
