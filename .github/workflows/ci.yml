name: Estate OS CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: estate-os-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  maintenance:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out canonical maintenance source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up maintenance Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.11"
      - name: Install reviewed maintenance dependency versions
        run: python -m pip install -r maintenance/runtime-requirements.lock.txt
      - name: Check dependency consistency
        run: python -m pip check
      - name: Verify maintenance failure, concurrency, credential and provider contracts
        working-directory: maintenance
        run: python -m pytest -q
  self-test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Compile control-plane and verification tools
        run: python -m py_compile SZL_ONE_OF_ONE_ESTATE_OS.py frontier_steward.py steward_public.py ci/*.py estate/*.py
      - name: Run deterministic Estate OS checks
        run: python SZL_ONE_OF_ONE_ESTATE_OS.py self-test
      - name: Test readiness signature-state contract
        run: python ci/test_verify_estate_readiness.py -v
      - name: Test deterministic remediation queue compiler
        run: python ci/test_build_remediation_queue.py -v
      - name: Test GitHub evidence completeness controls
        run: python ci/test_github_controls.py -v
      - name: Test explicit Hugging Face Space controls
        run: python ci/test_huggingface_controls.py -v
      - name: Test immutable provenance policy
        run: python ci/test_provenance_policy.py -v
      - name: Test public housekeeping privacy and failure contracts
        run: python ci/test_estate_inventory.py -v
      - name: Test Steward no-tool provider, absorbing policy, and recorded artifact contracts
        run: python -m unittest discover -s ci -p 'test*steward*.py' -v
      - name: Test read-only coordinator receipt chain and signing contracts
        run: python -I -B tools/coordinator/test_szl_coordinator.py -v
  snowflake-evidence-explorer:
    # Standard-library tests only: no package installs, no credentials. The
    # integration suite must skip here because its approval variables are unset.
    # The fakesnow emulator script needs pinned third-party packages and is not run.
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Test evidence core, receipt verifier and credential-gated integration skips
        working-directory: ops/snowflake/evidence-explorer/bundle
        run: |
          export SNOWFLAKE_HOME="$RUNNER_TEMP/snowflake-home"
          mkdir -p "$SNOWFLAKE_HOME"
          python -B -m unittest -v test_evidence_core test_verify_receipt test_integration_snowflake test_mutation_sweep
      - name: Test operator kit and offline runner contracts
        working-directory: ops/snowflake/evidence-explorer/kit
        run: |
          export SNOWFLAKE_HOME="$RUNNER_TEMP/snowflake-home"
          mkdir -p "$SNOWFLAKE_HOME"
          python -B -m unittest -v test_operator_kit
          python -I -B test_szl_ee_go.py -v
          python -I -B test_mutation_support.py -v
      - name: Require complete behavioral mutation evidence
        working-directory: ops/snowflake/evidence-explorer/bundle
        run: python -I -B mutation_sweep.py "$RUNNER_TEMP/ee-mutation-results.json"
      - name: Require complete operator-kit mutation evidence
        working-directory: ops/snowflake/evidence-explorer/kit
        run: python -I -B mutation_sweep_kit.py "$RUNNER_TEMP/ee-kit-mutation-results.json"
      - name: Preserve mutation evidence on success or failure
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: snowflake-core-mutations-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/ee-mutation-results.json
            ${{ runner.temp }}/ee-kit-mutation-results.json
          if-no-files-found: error
          retention-days: 14
