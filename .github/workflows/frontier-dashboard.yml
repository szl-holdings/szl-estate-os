name: Offline frontier dashboard checks

on:
  pull_request:
    paths:
      - 'tools/frontier_dashboard/**'
      - 'ci/test_frontier_dashboard.py'
      - '.github/workflows/frontier-dashboard.yml'
  push:
    branches: [main]
    paths:
      - 'tools/frontier_dashboard/**'
      - 'ci/test_frontier_dashboard.py'
      - '.github/workflows/frontier-dashboard.yml'

permissions:
  contents: read

concurrency:
  group: frontier-dashboard-${{ github.ref }}
  cancel-in-progress: true

jobs:
  offline-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - name: Test offline build, untrusted metadata, and evidence boundaries
        run: python ci/test_frontier_dashboard.py -v
      - name: Check browser script syntax
        run: node --check tools/frontier_dashboard/app.js
