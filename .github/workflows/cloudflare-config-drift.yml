name: Cloudflare config drift

# Scheduled, read-only comparison of the live Cloudflare account with the
# newest committed baseline under cloudflare/snapshots/ (THREAD_AUDIT C-29).
# The drift job reads the API with the READ-ONLY repository secret
# CLOUDFLARE_READ_TOKEN (setup: cloudflare/README.md#owner-steps). The client
# can only send GET requests, egress is limited to api.cloudflare.com plus the
# GitHub endpoints the job needs, and nothing is ever applied to Cloudflare.
#
# Without the secret, the preflight job emits a notice and the drift job is
# SKIPPED: no drift verdict is produced, and an absent token never reads as
# "no drift". With the secret, the run fails on DRIFT (exit 1) and on
# INCOMPLETE (exit 3: a section unreadable with this token, or a value the
# baseline marks as uncaptured). The report and the live export are uploaded
# for a reviewed baseline refresh either way.

on:
  schedule:
    - cron: "23 */6 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cloudflare-config-drift
  cancel-in-progress: false

jobs:
  offline:
    name: Snapshot integrity and drift contracts
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
        with:
          egress-policy: audit
          disable-telemetry: true

      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      - name: Test the exporter, normalizers and drift comparison
        run: python -I -B cloudflare/test_cf_config.py -v

      - name: Verify the committed snapshot
        run: python -I -B cloudflare/cf_config.py verify-snapshot

  preflight:
    name: Read-only token available on main
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      ready: ${{ steps.token.outputs.ready }}
    steps:
      - name: Check for the read-only token without reading it
        id: token
        env:
          TOKEN_PRESENT: ${{ secrets.CLOUDFLARE_READ_TOKEN != '' }}
          ON_MAIN: ${{ github.ref == 'refs/heads/main' }}
        run: |
          set -euo pipefail
          if [ "$TOKEN_PRESENT" != "true" ]; then
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::notice title=Cloudflare drift check skipped::Repository secret CLOUDFLARE_READ_TOKEN is not configured, so the live drift job is skipped and NO drift verdict was produced. Owner steps: cloudflare/README.md (Owner steps)."
            {
              echo "## Cloudflare config drift: SKIPPED"
              echo
              echo "The repository secret \`CLOUDFLARE_READ_TOKEN\` is not configured, so the live comparison did not run."
              echo "This is not a pass: no drift verdict was produced. Owner steps: \`cloudflare/README.md\`."
            } >> "$GITHUB_STEP_SUMMARY"
          elif [ "$ON_MAIN" != "true" ]; then
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::notice title=Cloudflare drift check skipped::The token is only used for runs of refs/heads/main; this run is for ${GITHUB_REF}. NO drift verdict was produced."
            {
              echo "## Cloudflare config drift: SKIPPED"
              echo
              echo "The read-only token is only used on \`refs/heads/main\`; this run is for \`${GITHUB_REF}\`. No drift verdict was produced."
            } >> "$GITHUB_STEP_SUMMARY"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

  drift:
    name: Live read-only drift check
    needs: [offline, preflight]
    if: needs.preflight.outputs.ready == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
        with:
          egress-policy: block
          disable-telemetry: true
          allowed-endpoints: >
            api.cloudflare.com:443
            github.com:443
            api.github.com:443
            codeload.github.com:443
            objects.githubusercontent.com:443
            release-assets.githubusercontent.com:443
            *.actions.githubusercontent.com:443
            results-receiver.actions.githubusercontent.com:443
            *.blob.core.windows.net:443

      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      - name: Compare the live account with the committed snapshot (GET only)
        env:
          CLOUDFLARE_READ_TOKEN: ${{ secrets.CLOUDFLARE_READ_TOKEN }}
        run: python -I -B cloudflare/cf_config.py drift --report outputs/cloudflare-drift.json --export-dir outputs/cloudflare-live

      - name: Upload the drift report and live export
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: cloudflare-config-drift
          path: |
            outputs/cloudflare-drift.json
            outputs/cloudflare-live/
          if-no-files-found: error
          retention-days: 14
