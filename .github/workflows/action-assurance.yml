name: Action assurance contracts

on:
  pull_request:
    paths:
      - "estate/action_assurance.py"
      - "estate/action_assurance_contract.py"
      - "estate/action_assurance_passport.py"
      - "estate/action_assurance_reporting.py"
      - "ci/verify_action_assurance.py"
      - "ci/test_action_assurance.py"
      - "schemas/action-assurance/**"
      - "fixtures/action_assurance/**"
      - "docs/ACTION_ASSURANCE.md"
      - ".github/workflows/action-assurance.yml"
  push:
    branches:
      - main
    paths:
      - "estate/action_assurance.py"
      - "estate/action_assurance_contract.py"
      - "estate/action_assurance_passport.py"
      - "estate/action_assurance_reporting.py"
      - "ci/verify_action_assurance.py"
      - "ci/test_action_assurance.py"
      - "schemas/action-assurance/**"
      - "fixtures/action_assurance/**"
      - "docs/ACTION_ASSURANCE.md"
      - ".github/workflows/action-assurance.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: action-assurance-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Validate passports, drift, and trust evidence
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2 # v2.22.2
        with:
          egress-policy: block
          disable-telemetry: true
          allowed-endpoints: >
            github.com:443
            api.github.com:443
            codeload.github.com:443
            objects.githubusercontent.com:443
            release-assets.githubusercontent.com:443
            *.actions.githubusercontent.com:443
            results-receiver.actions.githubusercontent.com:443
            *.blob.core.windows.net:443

      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      - name: Compile action assurance lane
        run: >-
          python -m py_compile
          estate/action_assurance.py
          estate/action_assurance_contract.py
          estate/action_assurance_passport.py
          estate/action_assurance_reporting.py
          ci/verify_action_assurance.py
          ci/test_action_assurance.py

      - name: Run adversarial contract tests
        run: >-
          python -m unittest discover
          -s ci
          -p 'test_action_assurance.py'
          -v

      - name: Build verification evidence packet
        run: python ci/verify_action_assurance.py

      - name: Upload verification evidence packet
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: action-assurance-${{ github.run_id }}
          path: outputs/action-assurance/
          if-no-files-found: warn
          retention-days: 30
