name: Estate OS CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: estate-os-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  self-test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Compile control-plane and verification tools
        run: python -m py_compile SZL_ONE_OF_ONE_ESTATE_OS.py ci/*.py
      - name: Run deterministic Estate OS checks
        run: python SZL_ONE_OF_ONE_ESTATE_OS.py self-test
      - name: Test readiness signature-state contract
        run: python ci/test_verify_estate_readiness.py -v
