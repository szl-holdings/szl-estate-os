name: Action assurance runtime

on:
  pull_request:
    paths:
      - "ACTION_ASSURANCE_RUNTIME.py"
      - "estate/action_assurance_store.py"
      - "ci/test_action_assurance_runtime.py"
      - "fixtures/action_assurance/**"
      - ".github/workflows/action-assurance-runtime.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: action-assurance-runtime-${{ github.ref }}
  cancel-in-progress: true

jobs:
  runtime:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@aebdcf6156ab6691adf63218240e476564a1ed4c # v2.23.0
        with:
          egress-policy: block
          disable-telemetry: true
          allowed-endpoints: >
            github.com:443
            api.github.com:443
            codeload.github.com:443
            objects.githubusercontent.com:443
            *.actions.githubusercontent.com:443
            results-receiver.actions.githubusercontent.com:443
            *.blob.core.windows.net:443

      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      - name: Compile runtime
        run: >-
          python -m py_compile
          ACTION_ASSURANCE_RUNTIME.py
          estate/action_assurance_store.py
          ci/test_action_assurance_runtime.py

      - name: Run runtime tests
        run: python ci/test_action_assurance_runtime.py -v

      - name: Exercise immutable ingest
        run: >-
          python ACTION_ASSURANCE_RUNTIME.py
          --database outputs/action-assurance-ci.db
          ingest
          --passports fixtures/action_assurance/passports
          --citations fixtures/action_assurance/citations.current.json
          --source-label github-actions
          --now 2026-08-11T05:30:00+00:00

      - name: Read durable status
        run: >-
          python ACTION_ASSURANCE_RUNTIME.py
          --database outputs/action-assurance-ci.db
          status

      - name: Read modeled report
        run: >-
          python ACTION_ASSURANCE_RUNTIME.py
          --database outputs/action-assurance-ci.db
          report
