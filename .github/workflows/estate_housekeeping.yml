name: Estate Housekeeping

# Credential-free public observations only. This job never updates main.

on:
  workflow_dispatch: {}
  schedule:
    - cron: "0 13 * * 1"  # Mondays 13:00 UTC

permissions:
  contents: read

concurrency:
  group: estate-housekeeping-public
  cancel-in-progress: false

jobs:
  inventory:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      - name: Test public inventory privacy and failure contracts
        run: python ci/test_estate_inventory.py -v

      - name: Run public estate inventory
        env:
          GH_TOKEN: ""
          GITHUB_TOKEN: ""
          HF_TOKEN: ""
          HUGGING_FACE_HUB_TOKEN: ""
        run: >-
          python tools/estate_inventory.py
          --github-org szl-holdings
          --hf-org SZLHOLDINGS
          --out outputs/housekeeping/estate_state.json

      - name: Upload public observation snapshot
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: estate-housekeeping-public-${{ github.run_id }}-${{ github.run_attempt }}
          path: outputs/housekeeping/estate_state.json
          if-no-files-found: error
          retention-days: 30
