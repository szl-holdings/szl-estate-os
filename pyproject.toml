[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "szl-estate-os"
version = "0.1.0"
description = "Governed, evidence-aware control plane for the SZL GitHub, Hugging Face, and domain estate."
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
authors = [{ name = "Stephen Lutar", email = "stephen@szlholdings.com" }]
dependencies = []

[project.urls]
Homepage = "https://a-11-oy.com"
Repository = "https://github.com/szl-holdings/szl-estate-os"

[tool.setuptools]
py-modules = ["ACTION_ASSURANCE_RUNTIME", "SZL_ONE_OF_ONE_ESTATE_OS", "frontier_steward", "operating_fabric", "steward_public"]

[tool.ruff]
line-length = 120
target-version = "py311"
extend-exclude = ["build", "dist", ".venv", "node_modules"]

[tool.pytest.ini_options]
minversion = "7.0"
